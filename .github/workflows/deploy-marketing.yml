name: deploy-marketing

# The marketing worker lives in marketing/ (worker.js + public/ assets, no
# build step) and serves favoritespage.us. Push to main deploys it; changes
# elsewhere in the repo do not. Mirrors deploy.yml for the favorites worker.
on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build check (no deploy)
        working-directory: marketing
        run: npx --yes wrangler@4 deploy --dry-run

      # Fail rather than skip: a deploy job that cannot deploy must not be green.
      - name: Require deploy credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — refusing to report success without deploying."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: marketing
          # Requires the favoritespage.us zone in the TGWAB account; the
          # deploy provisions the custom-domain DNS + cert itself.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'

# Renamed with the host move (owner ruling 2026-08-25). Deploying under a new name
# created a SECOND Worker, so favorites-mykk-us kept serving the old host through
# the move. Both bind the same KV namespace, so no data moved.
name = "favoritespage-app"
main = "worker.js"
account_id = "8a0d49b1f3fdcdadec135562ec8a4fdc" # TechGuyWithABeard — never another account
compatibility_date = "2025-10-01"

# Low-volume Worker; full sampling costs little and keeps request logs for debugging /api/state.
[observability]
enabled = true
head_sampling_rate = 1

# Static assets are matched before the Worker runs; worker.js only ever sees
# /api/state in practice.
[assets]
directory = "./public"

[[kv_namespaces]]
binding = "SHORTCUTS_KV"
id = "71257de3aef04824ad72e7597d0ed8ac"

# Owner ruling 2026-08-25: the app serves app.favoritespage.us, so the product and
# its app sit on one zone. The old host, favorites.mykk.us, is retired: its DNS was
# gone by 2026-09-13, and the owner accepted the early retirement.
[[routes]]
pattern = "app.favoritespage.us"
custom_domain = true

# Per-user tokens live in KV (token:<sha256> → userId) — see issue-token.sh.
# The legacy SYNC_TOKEN Worker secret is no longer read by the code.
